
<!DOCTYPE html>
<html>
<head>
<title>Bootstrap Carousel with Badges</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

<div class="container mt-5">

<h2 class="text-center mb-4">Product Showcase</h2>

<!-- Carousel -->
<div id="carouselExample" class="carousel slide">

<div class="carousel-inner">

<div class="carousel-item active">
<img src="https://via.placeholder.com/600x300" class="d-block w-100">
<div class="text-center mt-2">
Product 1 <span class="badge bg-success">New</span>
</div>
</div>

<div class="carousel-item">
<img src="https://via.placeholder.com/600x300" class="d-block w-100">
<div class="text-center mt-2">
Product 2 <span class="badge bg-warning">Featured</span>
</div>
</div>

<div class="carousel-item">
<img src="https://via.placeholder.com/600x300" class="d-block w-100">
<div class="text-center mt-2">
Product 3 <span class="badge bg-primary">Popular</span>
</div>
</div>

</div>

<!-- Previous Button -->
<button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
<span class="carousel-control-prev-icon bg-dark rounded"></span>
</button>

<!-- Next Button -->
<button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
<span class="carousel-control-next-icon bg-dark rounded"></span>
</button>

</div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
